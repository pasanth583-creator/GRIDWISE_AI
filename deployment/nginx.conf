# ==============================================================================
# GRIDWISE AI - Nginx Reverse Proxy Configuration
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Rate limiting zone (30 requests/sec per IP)
    limit_req_zone $binary_remote_addr zone=gridwise_api:10m rate=30r/s;

    # Upstream Flask Application
    upstream flask_app {
        server app:5000;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 25M;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Static Asset Caching
        location /static/ {
            alias /app/static/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # Dynamic Application Proxying
        location / {
            limit_req zone=gridwise_api burst=50 nodelay;

            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for mathematical optimization computation
            proxy_connect_timeout 120s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Health endpoint bypass rate limit
        location /health {
            proxy_pass http://flask_app/health;
            access_log off;
        }
    }
}

