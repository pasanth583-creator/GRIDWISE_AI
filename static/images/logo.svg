<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="batteryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Boundary -->
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="#0b132b" stroke="url(#gridGrad)" stroke-width="4" />

  <!-- Microgrid Power Lines -->
  <line x1="50" y1="20" x2="50" y2="50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="50" x2="25" y2="65" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="50" x2="75" y2="65" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />

  <!-- Central Microgrid Hub Node -->
  <circle cx="50" cy="50" r="10" fill="url(#gridGrad)" />
  <circle cx="50" cy="50" r="4" fill="#ffffff" />

  <!-- Solar Node (Top) -->
  <circle cx="50" cy="20" r="7" fill="url(#sunGrad)" />

  <!-- Battery Node (Bottom Left) -->
  <rect x="18" y="60" width="14" height="10" rx="2" fill="url(#batteryGrad)" />
  <rect x="32" y="62" width="2" height="6" rx="1" fill="url(#batteryGrad)" />

  <!-- Campus Load Node (Bottom Right) -->
  <polygon points="75,58 68,70 82,70" fill="#38bdf8" />
</svg>

